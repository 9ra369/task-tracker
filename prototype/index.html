<title>task_tracker — UIプロトタイプ</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg-0: #10121a;
    --bg-1: #171a23;
    --bg-2: #1e222c;
    --bg-3: #262b37;
    --bg-3-hover: #2c3140;
    --border: #2e3341;
    --border-soft: #23283333;
    --text-hi: #eceef3;
    --text-mid: #9aa0b1;
    --text-lo: #626879;
    --accent: #ff9f43;
    --accent-hi: #ffb668;
    --accent-soft: rgba(255, 159, 67, 0.15);
    --accent-ink: #201200;
    --success: #4ade80;
    --warning: #fbbf24;
    --danger: #f76d6d;
    --link: #6ea8fe;
    --shadow-menu: 0 12px 28px rgba(0, 0, 0, 0.4);
    --shadow-modal: 0 20px 50px rgba(0, 0, 0, 0.5);
    --shadow-cal: 0 14px 32px rgba(0, 0, 0, 0.45);
    --scrim-bg: rgba(6, 7, 11, 0.55);
    --radius-s: 6px;
    --radius-m: 10px;
    --font-mono: "JetBrains Mono", "Cascadia Code", ui-monospace, "SF Mono", Consolas, monospace;
    --font-sans: "IBM Plex Sans", "Segoe UI", ui-sans-serif, system-ui, "Hiragino Sans", "Yu Gothic", sans-serif;
  }

  /* Setting/Theme で切り替えるライトテーマ。ダークを基準に、面の明暗順序（page < panel < card < chip）は
     保ったまま色調だけ反転させる（単純な白黒反転ではなく、寒色寄りのニュートラルで統一）。 */
  body.theme-light {
    --bg-0: #eef0f5;
    --bg-1: #f7f8fb;
    --bg-2: #ffffff;
    --bg-3: #eef1f6;
    --bg-3-hover: #e3e7ee;
    --border: #d8dce4;
    --border-soft: #d8dce480;
    --text-hi: #1c1f26;
    --text-mid: #5b6070;
    --text-lo: #8b8fa0;
    --accent: #e07f1e;
    --accent-hi: #f0993c;
    --accent-soft: rgba(224, 127, 30, 0.14);
    --accent-ink: #2a1400;
    --success: #16a34a;
    --warning: #d97706;
    --danger: #dc2626;
    --link: #2563eb;
    --shadow-menu: 0 12px 28px rgba(30, 41, 59, 0.14);
    --shadow-modal: 0 24px 48px rgba(30, 41, 59, 0.18);
    --shadow-cal: 0 14px 30px rgba(30, 41, 59, 0.16);
    --scrim-bg: rgba(30, 34, 44, 0.32);
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg-0);
    color: var(--text-hi);
    font-family: var(--font-sans);
    font-size: 13.5px;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); color: var(--text-hi); }

  button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
  input, textarea, select {
    font-family: inherit; font-size: inherit; color: var(--text-hi);
    background: var(--bg-1); border: 1px solid var(--border);
    border-radius: var(--radius-s); padding: 6px 9px;
  }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ---------- タイトルバー ---------- */
  .titlebar {
    display: flex; flex-direction: column;
    background: var(--bg-1);
    border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  .menubar-row {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 16px; border-bottom: 1px solid var(--border-soft);
  }
  .brand-row { display: flex; align-items: center; padding: 9px 16px 10px; }

  .menu-wrap { position: relative; }
  .menu-btn {
    background: transparent; border: 1px solid transparent; border-radius: var(--radius-s);
    color: var(--text-mid); padding: 5px 10px; font-size: 12.5px;
  }
  .menu-btn:hover, .menu-btn.active { background: var(--bg-3); color: var(--text-hi); }
  .menu-dropdown {
    position: absolute; top: calc(100% + 4px); left: 0;
    background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-s);
    min-width: 200px; padding: 5px; display: none; flex-direction: column; gap: 1px;
    box-shadow: var(--shadow-menu); z-index: 40; max-height: 80vh; overflow-y: auto;
  }
  .menu-dropdown.open { display: flex; }
  #setting-menu-dropdown { width: 380px; }
  .menu-dropdown > button {
    background: transparent; border: none; text-align: left; color: var(--text-hi);
    padding: 7px 9px; border-radius: 5px; font-size: 12.5px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
  }
  .menu-dropdown > button:hover { background: var(--bg-3); }
  .menu-dropdown > button:disabled { opacity: 0.4; cursor: default; }
  .menu-dropdown > button:disabled:hover { background: transparent; }
  .menu-shortcut { font-size: 10.5px; color: var(--text-lo); font-family: var(--font-mono); }
  .menu-sep { height: 1px; background: var(--border); margin: 4px 2px; }
  .menu-check-row { display: flex; align-items: center; gap: 8px; padding: 7px 9px; font-size: 12.5px; border-radius: 5px; cursor: pointer; }
  .menu-check-row:hover { background: var(--bg-3); }
  .menu-check-row input { width: auto; padding: 0; }
  .menu-section-label { font-size: 10px; color: var(--text-lo); text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 9px 2px; }
  .menu-theme-row { display: flex; gap: 6px; padding: 2px 9px 6px; }
  .theme-choice { flex: 1; background: var(--bg-3); border: 1px solid var(--border); border-radius: var(--radius-s); padding: 6px 4px; font-size: 11px; color: var(--text-hi); }
  .theme-choice:hover { background: var(--bg-3-hover); }
  .theme-choice.active { border-color: var(--accent); background: var(--accent-soft); }
  .menu-field { padding: 2px 9px 8px; display: flex; flex-direction: column; gap: 5px; }
  .menu-field label { font-size: 10.5px; color: var(--text-mid); text-transform: uppercase; letter-spacing: 0.04em; }
  .menu-field input { width: 100%; font-size: 12px; }

  .brand { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .brand-mark { flex: 0 0 auto; display: block; }
  .brand-word {
    font-family: var(--font-mono); font-weight: 600; font-size: 14px; letter-spacing: 0.01em;
  }
  .brand .sub { color: var(--text-mid); font-size: 11.5px; margin-left: 2px; }

  .titlebar-spacer { flex: 1; }

  .icon-btn {
    background: transparent; border: 1px solid transparent; border-radius: var(--radius-s);
    color: var(--text-mid); width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .icon-btn:hover { background: var(--bg-3); color: var(--text-hi); }

  .user-chip { display: flex; align-items: center; gap: 7px; color: var(--text-mid); font-size: 12px; }
  .avatar {
    width: 22px; height: 22px; border-radius: 50%;
    background: linear-gradient(155deg, var(--accent), #ff7043); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 700; font-size: 11px; flex: 0 0 auto;
  }

  .btn {
    background: var(--bg-3); border: 1px solid var(--border); border-radius: var(--radius-s);
    padding: 6px 12px; font-size: 12px; color: var(--text-hi);
    transition: background 120ms ease, border-color 120ms ease;
  }
  .btn:hover { background: var(--bg-3-hover); border-color: #3a4053; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.primary:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
  .btn.ghost { background: transparent; }
  .btn.danger-text { color: var(--danger); }
  .btn.small { padding: 4px 8px; font-size: 11px; }

  /* ---------- ツールバー ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 16px; background: var(--bg-1);
    border-bottom: 1px solid var(--border); flex: 0 0 auto; flex-wrap: wrap;
  }
  .search-wrap { position: relative; max-width: 280px; flex: 1; min-width: 160px; }
  .search-wrap input { width: 100%; padding: 7px 10px 7px 28px; background: var(--bg-0); }
  .search-wrap svg { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--text-lo); }

  .filter-wrap { position: relative; }
  .filter-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 15px; height: 15px; padding: 0 4px; margin-left: 6px;
    background: var(--accent); color: var(--accent-ink); border-radius: 999px;
    font-size: 10px; font-weight: 700;
  }
  .filter-popover {
    position: absolute; top: calc(100% + 6px); left: 0; width: 260px;
    background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-m);
    padding: 12px; display: none; flex-direction: column; gap: 12px;
    box-shadow: var(--shadow-menu); z-index: 40; max-height: 70vh; overflow-y: auto;
  }
  .filter-popover.open { display: flex; }
  .filter-label { font-size: 10.5px; color: var(--text-mid); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .filter-prio-row { display: flex; gap: 8px; }
  .filter-chip {
    border: 1px solid var(--border); background: var(--bg-3); border-radius: var(--radius-s);
    padding: 5px 8px; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .filter-prio-row .filter-chip { flex: 1; }
  .filter-chip.active { border-color: var(--accent); background: var(--accent-soft); }
  .filter-tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-date-row { display: flex; gap: 6px; }
  .date-btn {
    background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-s);
    padding: 6px 8px; font-size: 11.5px; color: var(--text-hi); text-align: left; flex: 1;
    font-family: var(--font-mono);
  }
  .date-btn:hover { border-color: #3a4053; }
  .date-btn.empty { color: var(--text-lo); }
  .filter-actions { display: flex; justify-content: flex-end; }

  .sort-wrap { display: flex; align-items: center; gap: 6px; }
  .sort-label { font-size: 11px; color: var(--text-mid); white-space: nowrap; }
  .sort-wrap select { padding: 5px 8px; font-size: 11.5px; }

  .count-pill { font-family: var(--font-mono); font-size: 11px; color: var(--text-mid); white-space: nowrap; margin-left: auto; }

  /* ---------- カレンダーポップオーバー ---------- */
  .cal-popover {
    position: fixed; width: 226px; background: var(--bg-2); border: 1px solid var(--border);
    border-radius: var(--radius-m); padding: 10px; display: none; z-index: 60;
    box-shadow: var(--shadow-cal);
  }
  .cal-popover.open { display: block; }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-header button { background: transparent; border: none; color: var(--text-mid); font-size: 15px; padding: 2px 8px; border-radius: 5px; }
  .cal-header button:hover { background: var(--bg-3); color: var(--text-hi); }
  .cal-header span { font-family: var(--font-mono); font-size: 12px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-weekday { text-align: center; font-size: 10px; color: var(--text-lo); padding: 3px 0; }
  .cal-day {
    background: transparent; border: 1px solid transparent; border-radius: 5px;
    color: var(--text-hi); font-size: 11.5px; padding: 6px 0; font-family: var(--font-mono);
  }
  .cal-day:hover { background: var(--bg-3); }
  .cal-day.empty { visibility: hidden; }
  .cal-day.today { border-color: var(--accent); }
  .cal-day.selected { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .cal-footer { display: flex; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }

  /* ---------- タブの色ピッカー ---------- */
  .color-popover {
    position: fixed; width: 152px; background: var(--bg-2); border: 1px solid var(--border);
    border-radius: var(--radius-m); padding: 10px; display: none; z-index: 60;
    box-shadow: var(--shadow-cal);
  }
  .color-popover.open { display: block; }
  .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 8px; }
  .color-swatch {
    width: 26px; height: 26px; border-radius: 50%; padding: 0; cursor: pointer;
    border: 2px solid transparent; box-shadow: 0 0 0 1px var(--border) inset;
  }
  .color-swatch:hover { transform: scale(1.1); }
  .color-swatch.selected { border-color: var(--bg-2); box-shadow: 0 0 0 2px currentColor; }
  .color-none-btn {
    width: 100%; background: var(--bg-3); border: 1px solid var(--border); border-radius: var(--radius-s);
    padding: 6px; font-size: 11px; color: var(--text-hi);
  }
  .color-none-btn:hover { background: var(--bg-3-hover); }

  /* ---------- ボード ---------- */
  .board-outer { flex: 1 1 auto; overflow-x: auto; overflow-y: hidden; padding: 14px 16px 18px; }
  .board { display: flex; gap: 12px; height: 100%; align-items: flex-start; }

  .column {
    flex: 0 0 272px; display: flex; flex-direction: column; max-height: 100%;
    background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-m); overflow: hidden;
    border-top: 3px solid var(--border);
  }
  .column.drag-over { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

  .column-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 10px 8px 12px; border-bottom: 1px solid var(--border-soft);
  }
  .column-header.draggable { cursor: grab; }
  .column-header.draggable:active { cursor: grabbing; }
  .column-name {
    font-weight: 600; font-size: 12.5px; flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .column-name[contenteditable="true"] { outline: 1px dashed var(--accent); outline-offset: 2px; white-space: normal; }
  .column-color-btn {
    width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto;
    border: 1.5px solid var(--border); background: transparent; padding: 0; cursor: pointer;
    transition: transform 120ms ease;
  }
  .column-color-btn:hover { border-color: var(--text-mid); transform: scale(1.2); }
  .column-lock { color: var(--text-lo); font-size: 11px; flex: 0 0 auto; }
  .column-count { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-mid); background: var(--bg-3); border-radius: 999px; padding: 1px 7px; flex: 0 0 auto; }
  .column-menu-btn { background: transparent; border: none; color: var(--text-lo); padding: 2px 5px; border-radius: var(--radius-s); font-size: 14px; line-height: 1; }
  .column-menu-btn:hover { background: var(--bg-3); color: var(--text-hi); }

  .card-list { flex: 1 1 auto; overflow-y: auto; padding: 9px; display: flex; flex-direction: column; gap: 10px; min-height: 40px; }
  .card-list.flat { gap: 8px; }
  .card-list.flat:empty::after {
    content: "- empty -"; display: block; text-align: center; color: var(--text-lo);
    font-size: 11.5px; font-style: italic; padding: 14px 0 4px;
  }

  .group-block { display: flex; flex-direction: column; gap: 6px; }
  .group-header { display: flex; align-items: center; gap: 6px; padding: 0 2px; }
  .group-name { font-size: 11px; font-weight: 600; color: var(--text-mid); text-transform: uppercase; letter-spacing: 0.03em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .group-name[contenteditable="true"] { outline: 1px dashed var(--accent); outline-offset: 2px; white-space: normal; text-transform: none; }
  .group-count { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-lo); flex: 0 0 auto; }
  .group-delete { background: transparent; border: none; color: var(--text-lo); font-size: 12px; padding: 1px 4px; border-radius: 4px; flex: 0 0 auto; }
  .group-delete:hover { background: var(--bg-3); color: var(--danger); }
  .group-card-list {
    display: flex; flex-direction: column; gap: 8px; min-height: 30px;
    padding: 2px 0 4px 9px; border-left: 2px solid var(--border-soft);
  }
  .group-card-list:empty::after { content: "- empty -"; display: block; color: var(--text-lo); font-size: 10.5px; font-style: italic; padding: 6px 0; }
  .group-card-list.drag-over { border-left-color: var(--accent); }
  .add-group-btn {
    background: transparent; border: 1px dashed var(--border); border-radius: var(--radius-s);
    color: var(--text-mid); padding: 6px 8px; font-size: 11px; text-align: left; margin-top: 2px;
  }
  .add-group-btn:hover { background: var(--bg-2); color: var(--text-hi); border-color: #3a4053; }
  .add-card-in-group { margin-left: 9px; }

  .card {
    background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-s);
    padding: 9px 10px; cursor: pointer; transition: border-color 120ms ease;
    user-select: none;
  }
  .card:hover { border-color: #3a4053; }
  .card.dragging { opacity: 0.4; }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; background: var(--accent-soft); }
  .card.drop-before { box-shadow: 0 -2px 0 0 var(--accent); }
  .card.drop-after { box-shadow: 0 2px 0 0 var(--accent); }
  .card-top { display: flex; align-items: flex-start; gap: 6px; }
  .prio-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 4px; flex: 0 0 auto; }
  .prio-high { background: var(--danger); }
  .prio-mid { background: var(--warning); }
  .prio-low { background: var(--success); }
  .card-title { font-size: 12.5px; font-weight: 500; line-height: 1.4; flex: 1; }

  .card-tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
  .tag-pill { font-size: 10px; color: var(--text-mid); background: var(--bg-3); border: 1px solid var(--border); border-radius: 999px; padding: 2px 7px; }

  .card-memo {
    margin-top: 6px; font-size: 11px; color: var(--text-mid); line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .card-dates { margin-top: 7px; }
  .date-range { font-family: var(--font-mono); font-size: 10px; color: var(--text-mid); }
  .date-range.overdue { color: var(--danger); }
  .date-bar { height: 3px; border-radius: 999px; background: var(--bg-3); margin-top: 4px; overflow: hidden; }
  .date-bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .date-bar-fill.overdue { background: var(--danger); }

  .card-links { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 5px; }
  .link-chip {
    background: var(--bg-3); border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 8px 3px 7px; font-size: 10.5px; color: var(--link);
    display: inline-flex; align-items: center; gap: 4px; max-width: 100%;
  }
  .link-chip:hover { background: var(--bg-3-hover); border-color: #3a4053; }
  .link-chip .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }

  .card-meta { display: flex; align-items: center; gap: 8px; margin-top: 7px; font-size: 10.5px; color: var(--text-mid); }
  .card-assignee { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .mini-avatar {
    width: 15px; height: 15px; border-radius: 50%; background: var(--bg-3); color: var(--text-mid);
    font-family: var(--font-mono); font-size: 8.5px; display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto; border: 1px solid var(--border);
  }

  .add-card-btn {
    background: transparent; border: 1px dashed var(--border); border-radius: var(--radius-s);
    color: var(--text-mid); padding: 7px 8px; font-size: 11.5px; text-align: left;
  }
  .add-card-btn:hover { background: var(--bg-2); color: var(--text-hi); border-color: #3a4053; }

  .col-bottom-actions { padding: 6px 9px 9px; display: flex; flex-direction: column; gap: 6px; }
  .quick-add-actions { display: flex; gap: 6px; }

  .column.add-column {
    background: transparent; border: 1px dashed var(--border);
    justify-content: center; align-items: center; min-height: 46px; padding: 4px;
  }
  .add-column-btn { background: transparent; border: none; color: var(--text-mid); font-size: 12.5px; padding: 10px 14px; width: 100%; text-align: center; }
  .add-column-btn:hover { color: var(--text-hi); }
  .add-column-form, .add-group-form { display: flex; flex-direction: column; gap: 6px; padding: 4px 2px; width: 100%; }

  /* ---------- 一括操作バー ---------- */
  .bulk-bar {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-2); border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 10px 8px 16px; box-shadow: var(--shadow-cal); z-index: 25;
  }
  .bulk-bar[hidden] { display: none; }
  .bulk-bar span { font-size: 12px; color: var(--text-hi); white-space: nowrap; }
  .bulk-bar select { padding: 5px 8px; font-size: 11.5px; }

  /* ---------- モーダル共通（カード詳細・設定） ---------- */
  .scrim { position: fixed; inset: 0; background: var(--scrim-bg); opacity: 0; pointer-events: none; transition: opacity 160ms ease; z-index: 20; }
  .scrim.open { opacity: 1; pointer-events: auto; }

  .modal {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.98);

  function migrate(data) {
    if (!data.settings) data.settings = { multiUser: false, currentUser: "泉谷", savePath: "", sortMode: "created", priorityEnabled: true, groupsEnabled: true, tagsEnabled: true, theme: "dark" };

    if (data.settings.tagsEnabled === undefined) data.settings.tagsEnabled = true;
    if (data.settings.theme !== "light") data.settings.theme = "dark";
    (data.columns || []).forEach(function (c) {
      if (!c.groups) c.groups = [];
      if (c.color === undefined) c.color = null;

    try {
      var raw = localStorage.getItem(STORAGE_KEY);

  function undo() {
    if (undoStack.length === 0) { showToast("これ以上元に戻せません"); return; }
    redoStack.push(JSON.parse(JSON.stringify(state.columns)));
    state.columns = undoStack.pop();
    clearSelection();
    save();
    render();

  }
  function redo() {
    if (redoStack.length === 0) { showToast("これ以上やり直せません"); return; }

  }

    showToast._t = setTimeout(function () { toastEl.classList.remove("show"); }, 1900);
  }

  /* ================= カレンダーピッカー ================= */
  var calPopover = document.getElementById("cal-popover");
  var calGrid = document.getElementById("cal-grid");
  var calLabel = document.getElementById("cal-label");
  var calViewDate = new Date();
  var calSelectedValue = "";
  var calCallback = null;

  function renderCalendar() {
    var y = calViewDate.getFullYear(), m = calViewDate.getMonth();
    calLabel.textContent = y + "年" + (m + 1) + "月";
    calGrid.innerHTML = "";
    ["日", "月", "火", "水", "木", "金", "土"].forEach(function (w) {
      var el = document.createElement("div");
      el.className = "cal-weekday";
      el.textContent = w;
      calGrid.appendChild(el);
    });
    var firstDow = new Date(y, m, 1).getDay();
    var totalDays = new Date(y, m + 1, 0).getDate();
    var tStr = todayStr();
    for (var i = 0; i < firstDow; i++) {
      var blank = document.createElement("div");
      blank.className = "cal-day empty";
      calGrid.appendChild(blank);
    }
    for (var d = 1; d <= totalDays; d++) {
      var dateStr = toDateStr(y, m, d);
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cal-day" + (dateStr === tStr ? " today" : "") + (dateStr === calSelectedValue ? " selected" : "");
      btn.textContent = d;
      btn.dataset.date = dateStr;
      btn.addEventListener("click", function (ev) {
        var ds = ev.currentTarget.dataset.date;
        if (calCallback) calCallback(ds);
        closeCalendar();
      });
      calGrid.appendChild(btn);
    }
  }

  function openCalendar(anchorEl, currentValue, callback) {
    calCallback = callback;
    calSelectedValue = currentValue || "";
    calViewDate = currentValue ? new Date(currentValue + "T00:00:00") : new Date();
    renderCalendar();
    calPopover.classList.add("open");
    var rect = anchorEl.getBoundingClientRect();
    var top = rect.bottom + 6;
    var left = rect.left;
    var maxLeft = window.innerWidth - 236;
    if (left > maxLeft) left = Math.max(8, maxLeft);
    var maxTop = window.innerHeight - 300;
    if (top > maxTop) top = rect.top - 300;
    calPopover.style.top = top + "px";
    calPopover.style.left = left + "px";
  }
  function closeCalendar() { calPopover.classList.remove("open"); calCallback = null; }

  document.getElementById("cal-prev").addEventListener("click", function () { calViewDate.setMonth(calViewDate.getMonth() - 1); renderCalendar(); });
  document.getElementById("cal-next").addEventListener("click", function () { calViewDate.setMonth(calViewDate.getMonth() + 1); renderCalendar(); });
  document.getElementById("cal-clear").addEventListener("click", function () { if (calCallback) calCallback(""); closeCalendar(); });
  document.getElementById("cal-today").addEventListener("click", function () { if (calCallback) calCallback(todayStr()); closeCalendar(); });

  document.addEventListener("mousedown", function (e) {
    if (calPopover.classList.contains("open") && !calPopover.contains(e.target) && !e.target.closest(".date-btn")) {
      closeCalendar();
    }
  });

  /* ================= タブの色ピッカー ================= */
  var COLUMN_COLORS = ["#f43f5e", "#f97316", "#eab308", "#22c55e", "#14b8a6", "#3b82f6", "#a855f7", "#ec4899"];
  var colorPopover = document.getElementById("color-popover");
  var colorTargetColId = null;

  function renderColorGrid() {
    var col = state.columns.find(function (c) { return c.id === colorTargetColId; });
    var grid = document.getElementById("color-grid");
    grid.innerHTML = COLUMN_COLORS.map(function (c) {
      return '<button type="button" class="color-swatch' + (col && col.color === c ? " selected" : "") + '" style="background:' + c + ';color:' + c + '" data-color="' + c + '" aria-label="' + c + '"></button>';
    }).join("");
    grid.querySelectorAll(".color-swatch").forEach(function (btn) {
      btn.addEventListener("click", function () {
        setColumnColor(colorTargetColId, btn.dataset.color);
        closeColorPicker();
      });
    });
  }
  function openColorPicker(anchorEl, colId) {
    colorTargetColId = colId;
    renderColorGrid();
    colorPopover.classList.add("open");
    var rect = anchorEl.getBoundingClientRect();
    var top = rect.bottom + 6;
    var left = rect.left;
    var maxLeft = window.innerWidth - 168;
    if (left > maxLeft) left = Math.max(8, maxLeft);
    colorPopover.style.top = top + "px";
    colorPopover.style.left = left + "px";
  }
  function closeColorPicker() { colorPopover.classList.remove("open"); colorTargetColId = null; }
  function setColumnColor(colId, color) {
    var col = state.columns.find(function (c) { return c.id === colId; });
    if (!col) return;
    pushUndoSnapshot();
    col.color = color;
    save();
    render();
  }
  document.getElementById("color-none-btn").addEventListener("click", function () {
    setColumnColor(colorTargetColId, null);
    closeColorPicker();
  });
  document.addEventListener("mousedown", function (e) {
    if (colorPopover.classList.contains("open") && !colorPopover.contains(e.target) && !e.target.closest(".column-color-btn")) {
      closeColorPicker();
    }
  });

  /* ================= ヘルパー ================= */
  function dateRangeInfo(card) {
    if (!card.startDate && !card.dueDate) return null;
    var label = "";
    if (card.startDate && card.dueDate) label = formatShort(card.startDate) + " → " + formatShort(card.dueDate);
    else if (card.startDate) label = "開始 " + formatShort(card.startDate);
    else label = "目標 " + formatShort(card.dueDate);

    var overdue = false, pct = null;
    var t = todayStr();
    if (card.dueDate && t > card.dueDate) overdue = true;
    if (card.startDate && card.dueDate && card.dueDate >= card.startDate) {
      var s = new Date(card.startDate + "T00:00:00").getTime();
      var e = new Date(card.dueDate + "T00:00:00").getTime();
      var now = new Date(t + "T00:00:00").getTime();
      pct = e === s ? 100 : Math.max(0, Math.min(100, ((now - s) / (e - s)) * 100));
    }
    return { label: label, overdue: overdue, pct: pct };
  }

  function cardMatchesFilters(card) {
    var q = searchInput.value.trim().toLowerCase();
    if (q && (card.title || "").toLowerCase().indexOf(q) === -1) return false;
    if (state.settings.priorityEnabled !== false && filters.priorities.size > 0 && !filters.priorities.has(card.priority || "mid")) return false;
    if (filters.dueFrom && (!card.dueDate || card.dueDate < filters.dueFrom)) return false;
    if (filters.dueTo && (!card.dueDate || card.dueDate > filters.dueTo)) return false;
    if (filters.tags.size > 0) {
      var cardTags = card.tags || [];
      if (!cardTags.some(function (t) { return filters.tags.has(t); })) return false;
    }
    if (state.settings.multiUser && filters.assignee) {
      if ((card.assignee || "").toLowerCase().indexOf(filters.assignee.toLowerCase()) === -1) return false;
    }
    return true;
  }

  function allTagsInBoard() {
    var set = new Set();
    state.columns.forEach(function (c) { c.cards.forEach(function (cd) { (cd.tags || []).forEach(function (t) { set.add(t); }); }); });
    return Array.from(set).sort();
  }

  /* ================= カード要素の生成 ================= */
  function buildCardEl(card, col) {
    var multiUser = state.settings.multiUser;
    var cardEl = document.createElement("div");
    cardEl.className = "card" + (selectedCardIds.has(card.id) ? " selected" : "");
    cardEl.draggable = true;
    cardEl.dataset.cardId = card.id;
    cardEl.dataset.colId = col.id;
    cardEl.tabIndex = 0;

    var tagsHtml = "";
    if (state.settings.tagsEnabled !== false && card.tags && card.tags.length) {
      tagsHtml = '<div class="card-tags">' + card.tags.map(function (t) { return '<span class="tag-pill">#' + escapeHtml(t) + '</span>'; }).join("") + '</div>';
    }

    var memoHtml = card.memo ? '<div class="card-memo">' + escapeHtml(card.memo) + '</div>' : "";

    var dateHtml = "";
    var info = dateRangeInfo(card);
    if (info) {
      dateHtml = '<div class="card-dates"><span class="date-range' + (info.overdue ? " overdue" : "") + '">' + escapeHtml(info.label) + '</span>';
      if (info.pct !== null) {
        dateHtml += '<div class="date-bar"><div class="date-bar-fill' + (info.overdue ? " overdue" : "") + '" style="width:' + info.pct.toFixed(0) + '%"></div></div>';
      }
      dateHtml += '</div>';
    }

    var linksHtml = "";
    if (card.links && card.links.length) {
      linksHtml = '<div class="card-links">' + card.links.map(function (lk) {
        var label = lk.label || lk.url;
        return '<button type="button" class="link-chip" data-url="' + escapeHtml(lk.url) + '"><span>🔗</span><span class="lbl">' + escapeHtml(label) + '</span></button>';
      }).join("") + '</div>';
    }

    var metaHtml = "";
    if (multiUser) {
      metaHtml = '<div class="card-meta"><span class="card-assignee">' +
        (card.assignee ? '<span class="mini-avatar">' + escapeHtml(initials(card.assignee)) + '</span><span>' + escapeHtml(card.assignee) + '</span>' : '<span style="color:var(--text-lo)">未割当</span>') +
        '</span></div>';
    }

    var prioDotHtml = state.settings.priorityEnabled !== false ? '<span class="prio-dot prio-' + (card.priority || "mid") + '"></span>' : "";
    cardEl.innerHTML =
      '<div class="card-top">' + prioDotHtml + '<span class="card-title">' + escapeHtml(card.title) + '</span></div>' +
      tagsHtml + memoHtml + dateHtml + linksHtml + metaHtml;

    cardEl.querySelectorAll(".link-chip").forEach(function (chip) {
      chip.addEventListener("click", function (e) { e.stopPropagation(); openLink(chip.dataset.url); });
    });

    cardEl.addEventListener("click", function (e) {
      if (e.shiftKey) { toggleCardSelection(card.id, cardEl); return; }
      openDrawer(col.id, card.id);
    });
    cardEl.addEventListener("dragstart", function (e) {
      dragCardId = card.id;
      dragColId = null;
      cardEl.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    cardEl.addEventListener("dragend", function () { cardEl.classList.remove("dragging"); dragCardId = null; });

    cardEl.addEventListener("dragover", function (e) {
      if (!dragCardId || dragCardId === card.id || state.settings.sortMode !== "manual") return;
      e.preventDefault();
      e.stopPropagation();
      var rect = cardEl.getBoundingClientRect();
      var before = (e.clientY - rect.top) < rect.height / 2;
      cardEl.classList.toggle("drop-before", before);
      cardEl.classList.toggle("drop-after", !before);
    });
    cardEl.addEventListener("dragleave", function () { cardEl.classList.remove("drop-before", "drop-after"); });
    cardEl.addEventListener("drop", function (e) {
      if (!dragCardId || dragCardId === card.id || state.settings.sortMode !== "manual") return;
      e.preventDefault();
      e.stopPropagation();
      var rect = cardEl.getBoundingClientRect();
      var before = (e.clientY - rect.top) < rect.height / 2;
      cardEl.classList.remove("drop-before", "drop-after");
      reorderCardManual(dragCardId, col.id, card.id, before);
    });

    return cardEl;
  }

  function openLink(url) {
    if (/^https?:\/\//i.test(url)) {
      window.open(url, "_blank", "noopener");
    } else {
      showToast("ローカルパスです。Electron版ではOSの既定アプリ／File Explorerで開きます。");
    }
  }

  /* ================= 描画 ================= */
  function render() {
    boardEl.innerHTML = "";
    var total = 0;
    var multiUser = state.settings.multiUser;
    var manual = state.settings.sortMode === "manual";
    var groupsOn = state.settings.groupsEnabled !== false;

    var sortedCols = state.columns.slice().sort(function (a, b) { return a.order - b.order; });

    sortedCols.forEach(function (col) {
      var filteredCards = col.cards.filter(cardMatchesFilters);
      if (!manual) filteredCards = filteredCards.slice().sort(function (a, b) { return (a.createdAt || "").localeCompare(b.createdAt || ""); });
      total += filteredCards.length;

      var colEl = document.createElement("div");
      colEl.className = "column";
      colEl.dataset.colId = col.id;
      if (col.color) colEl.style.borderTopColor = col.color;

      var header = document.createElement("div");
      header.className = "column-header" + (col.fixed ? "" : " draggable");
      header.draggable = !col.fixed;
      header.innerHTML =
        '<span class="column-name" data-col-id="' + col.id + '" tabindex="0">' + escapeHtml(col.name) + '</span>' +
        '<button type="button" class="column-color-btn" data-action="color" data-col-id="' + col.id + '" title="タブの色"' + (col.color ? ' style="background:' + col.color + ';border-color:' + col.color + '"' : '') + '></button>' +
        (col.fixed ? '<span class="column-lock" title="固定タブ（削除・移動不可）">🔒</span>' : '') +
        '<span class="column-count">' + col.cards.length + '</span>' +
        (col.fixed ? '' : '<button class="column-menu-btn" data-action="delete-col" data-col-id="' + col.id + '" title="このタブを削除">×</button>');
      colEl.appendChild(header);

      var list = document.createElement("div");
      list.dataset.colId = col.id;

      if (!groupsOn || !col.groups || col.groups.length === 0) {
        list.className = "card-list flat";
        filteredCards.forEach(function (card) { list.appendChild(buildCardEl(card, col)); });
      } else {
        list.className = "card-list";
        col.groups.slice().sort(function (a, b) { return a.order - b.order; }).forEach(function (grp) {
          var groupCards = filteredCards.filter(function (c) { return c.groupId === grp.id; });
          list.appendChild(buildGroupBlock(col, grp, groupCards));
        });
        var validGroupIds = col.groups.map(function (g) { return g.id; });
        var ungrouped = filteredCards.filter(function (c) { return !c.groupId || validGroupIds.indexOf(c.groupId) === -1; });
        list.appendChild(buildGroupBlock(col, null, ungrouped));
      }

      colEl.appendChild(list);

      var bottomActions = document.createElement("div");
      bottomActions.className = "col-bottom-actions";
      bottomActions.innerHTML =
        '<button class="add-card-btn" data-action="add-card" data-col-id="' + col.id + '">＋ タスクを追加</button>' +
        (groupsOn ? '<button class="add-group-btn" data-action="add-group" data-col-id="' + col.id + '">＋ グループを追加</button>' : '');
      colEl.appendChild(bottomActions);

      colEl.addEventListener("dragover", function (e) { if (dragCardId) { e.preventDefault(); colEl.classList.add("drag-over"); } });
      colEl.addEventListener("dragleave", function () { colEl.classList.remove("drag-over"); });
      colEl.addEventListener("drop", function (e) {
        e.preventDefault();
        colEl.classList.remove("drag-over");
        if (dragCardId) moveCard(dragCardId, col.id);
      });

      if (!col.fixed) {
        header.addEventListener("dragstart", function (e) {
          if (e.target.getAttribute && e.target.getAttribute("contenteditable") === "true") { e.preventDefault(); return; }
          dragColId = col.id;
          dragCardId = null;
          e.dataTransfer.effectAllowed = "move";
          e.stopPropagation();
        });
      }
      header.addEventListener("dragover", function (e) { if (dragColId && dragColId !== col.id && !col.fixed) e.preventDefault(); });
      header.addEventListener("drop", function (e) {
        if (dragColId && dragColId !== col.id && !col.fixed) {
          e.preventDefault();
          e.stopPropagation();
          reorderColumn(dragColId, col.id);
        }
      });

      boardEl.appendChild(colEl);
    });

    var addColEl = document.createElement("div");
    addColEl.className = "column add-column";
    addColEl.innerHTML = '<button class="add-column-btn" id="btn-add-column">＋ 新しいタブを追加</button>';
    boardEl.appendChild(addColEl);

    totalCountEl.textContent = "全 " + total + " 件";
    document.getElementById("user-chip").hidden = !multiUser;
    document.getElementById("sort-mode-select").value = state.settings.sortMode;
    document.getElementById("setting-priority-enabled").checked = state.settings.priorityEnabled !== false;
    document.getElementById("setting-groups-enabled").checked = groupsOn;
    document.getElementById("setting-tags-enabled").checked = state.settings.tagsEnabled !== false;
    document.getElementById("filter-priority-wrap").hidden = state.settings.priorityEnabled === false;
    updateThemeButtons();
    attachStaticHandlers();
    updateBulkBar();
    updateFilterTagOptions();
    updateUndoRedoButtons();
  }

  function buildGroupBlock(col, grp, cards) {
    var block = document.createElement("div");
    block.className = "group-block";

    if (grp) {
      var header = document.createElement("div");
      header.className = "group-header";
      header.innerHTML =
        '<span class="group-name" data-col-id="' + col.id + '" data-group-id="' + grp.id + '" tabindex="0">' + escapeHtml(grp.name) + '</span>' +
        '<span class="group-count">' + cards.length + '</span>' +
        '<button class="group-delete" data-action="delete-group" data-col-id="' + col.id + '" data-group-id="' + grp.id + '" title="グループを削除">×</button>';
      block.appendChild(header);
    } else if (col.groups && col.groups.length > 0) {
      var uHeader = document.createElement("div");
      uHeader.className = "group-header";
      uHeader.innerHTML = '<span class="group-name">未分類</span><span class="group-count">' + cards.length + '</span>';
      block.appendChild(uHeader);
    }

    var groupList = document.createElement("div");
    groupList.className = "group-card-list";
    groupList.dataset.colId = col.id;
    groupList.dataset.groupId = grp ? grp.id : "";
    cards.forEach(function (card) { groupList.appendChild(buildCardEl(card, col)); });
    block.appendChild(groupList);

    groupList.addEventListener("dragover", function (e) { if (dragCardId) { e.preventDefault(); e.stopPropagation(); groupList.classList.add("drag-over"); } });
    groupList.addEventListener("dragleave", function () { groupList.classList.remove("drag-over"); });
    groupList.addEventListener("drop", function (e) {
      if (!dragCardId) return;
      e.preventDefault();
      e.stopPropagation();
      groupList.classList.remove("drag-over");
      moveCardToGroup(dragCardId, col.id, grp ? grp.id : null);
    });

    if (grp) {
      var addBtn = document.createElement("button");
      addBtn.className = "add-card-btn add-card-in-group";
      addBtn.textContent = "＋ タスクを追加";
      addBtn.addEventListener("click", function () { openDrawer(col.id, null, grp.id); });
      block.appendChild(addBtn);
    }

    return block;
  }

  function attachStaticHandlers() {
    boardEl.querySelectorAll('[data-action="delete-col"]').forEach(function (btn) {
      btn.addEventListener("click", function (e) { e.stopPropagation(); deleteColumn(btn.dataset.colId); });
    });
    boardEl.querySelectorAll('[data-action="color"]').forEach(function (btn) {
      btn.addEventListener("click", function (e) { e.stopPropagation(); openColorPicker(btn, btn.dataset.colId); });
    });
    boardEl.querySelectorAll('[data-action="add-card"]').forEach(function (btn) {
      btn.addEventListener("click", function () { openDrawer(btn.dataset.colId, null); });
    });
    boardEl.querySelectorAll('[data-action="add-group"]').forEach(function (btn) {
      btn.addEventListener("click", function () { showAddGroupForm(btn); });
    });
    boardEl.querySelectorAll('[data-action="delete-group"]').forEach(function (btn) {
      btn.addEventListener("click", function (e) { e.stopPropagation(); deleteGroup(btn.dataset.colId, btn.dataset.groupId); });
    });
    boardEl.querySelectorAll(".column-name").forEach(function (el) {
      el.addEventListener("dblclick", function () { startRenameColumn(el); });
      el.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); el.blur(); } });
    });
    boardEl.querySelectorAll(".group-name[data-group-id]").forEach(function (el) {
      el.addEventListener("dblclick", function () { startRenameGroup(el); });
      el.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); el.blur(); } });
    });
    var addColBtn = document.getElementById("btn-add-column");
    if (addColBtn) addColBtn.addEventListener("click", showAddColumnForm);
  }

  function startRenameColumn(el) {
    el.setAttribute("contenteditable", "true");
    el.focus();
    document.execCommand("selectAll", false, null);
    function commit() {
      el.removeAttribute("contenteditable");
      var col = state.columns.find(function (c) { return c.id === el.dataset.colId; });
      var newName = el.textContent.trim();
      if (col && newName && newName !== col.name) { pushUndoSnapshot(); col.name = newName; save(); }
      render();
    }
    el.addEventListener("blur", commit, { once: true });
  }

  function startRenameGroup(el) {
    el.setAttribute("contenteditable", "true");
    el.focus();
    document.execCommand("selectAll", false, null);
    function commit() {
      el.removeAttribute("contenteditable");
      var col = state.columns.find(function (c) { return c.id === el.dataset.colId; });
      var grp = col && col.groups.find(function (g) { return g.id === el.dataset.groupId; });
      var newName = el.textContent.trim();
      if (grp && newName && newName !== grp.name) { pushUndoSnapshot(); grp.name = newName; save(); }
      render();
    }
    el.addEventListener("blur", commit, { once: true });
  }

  function showAddColumnForm() {
    var addColEl = boardEl.querySelector(".add-column");
    addColEl.innerHTML =
      '<form class="add-column-form" id="add-column-form">' +
        '<input type="text" id="new-col-name" placeholder="タブ名（例: レビュー待ち）" autocomplete="off" />' +
        '<div class="quick-add-actions">' +
          '<button type="submit" class="btn primary small">追加</button>' +
          '<button type="button" class="btn ghost small" id="cancel-add-column">キャンセル</button>' +
        '</div>' +
      '</form>';
    var input = document.getElementById("new-col-name");
    input.focus();
    document.getElementById("cancel-add-column").addEventListener("click", render);
    document.getElementById("add-column-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var name = input.value.trim();
      if (!name) return;
      addColumn(name);
      showToast('タブ「' + name + '」を追加しました');
    });
  }

  function showAddGroupForm(triggerBtn) {
    var colId = triggerBtn.dataset.colId;
    var wrap = triggerBtn.parentElement;
    wrap.innerHTML =
      '<form class="add-group-form" id="add-group-form">' +
        '<input type="text" id="new-group-name" placeholder="グループ名（例: プロジェクトA）" autocomplete="off" />' +
        '<div class="quick-add-actions">' +
          '<button type="submit" class="btn primary small">追加</button>' +
          '<button type="button" class="btn ghost small" id="cancel-add-group">キャンセル</button>' +
        '</div>' +
      '</form>';
    var input = document.getElementById("new-group-name");
    input.focus();
    document.getElementById("cancel-add-group").addEventListener("click", render);
    document.getElementById("add-group-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var name = input.value.trim();
      if (!name) return;
      addGroup(colId, name);
      showToast('グループ「' + name + '」を追加しました');
    });
  }

  function addColumn(name) {
    pushUndoSnapshot();
    var newCol = { id: uid("col"), name: name, order: 0, fixed: null, groups: [], cards: [] };
    state.columns.push(newCol);
    normalizeColumnOrder();
    save();
    render();
  }

  function normalizeColumnOrder() {
    var start = state.columns.filter(function (c) { return c.fixed === "start"; });
    var end = state.columns.filter(function (c) { return c.fixed === "end"; });
    var mid = state.columns.filter(function (c) { return !c.fixed; }).sort(function (a, b) { return a.order - b.order; });
    var ordered = start.concat(mid, end);
    ordered.forEach(function (c, i) { c.order = i; });
  }

  function deleteColumn(colId) {
    var col = state.columns.find(function (c) { return c.id === colId; });
    if (!col || col.fixed) return;
    if (col.cards.length > 0 && !confirm('「' + col.name + '」には ' + col.cards.length + ' 件のタスクがあります。削除しますか？')) return;
    pushUndoSnapshot();
    state.columns = state.columns.filter(function (c) { return c.id !== colId; });
    normalizeColumnOrder();
    save();
    render();
    showToast('タブ「' + col.name + '」を削除しました');
  }

  function reorderColumn(draggedId, targetId) {
    var draggedCol = state.columns.find(function (c) { return c.id === draggedId; });
    var targetCol = state.columns.find(function (c) { return c.id === targetId; });
    if (!draggedCol || !targetCol || draggedCol.fixed || targetCol.fixed) { dragColId = null; return; }
    pushUndoSnapshot();
    var mid = state.columns.filter(function (c) { return !c.fixed; }).sort(function (a, b) { return a.order - b.order; });
    var di = mid.findIndex(function (c) { return c.id === draggedId; });
    var ti = mid.findIndex(function (c) { return c.id === targetId; });
    mid.splice(di, 1);
    mid.splice(ti, 0, draggedCol);
    mid.forEach(function (c, i) { c.order = i; });
    dragColId = null;
    normalizeColumnOrder();
    save();
    render();
  }

  function addGroup(colId, name) {
    var col = state.columns.find(function (c) { return c.id === colId; });
    if (!col) return;
    pushUndoSnapshot();
    var maxOrder = col.groups.reduce(function (m, g) { return Math.max(m, g.order); }, -1);
    col.groups.push({ id: uid("grp"), name: name, order: maxOrder + 1 });
    save();
    render();
  }

  function deleteGroup(colId, groupId) {
    var col = state.columns.find(function (c) { return c.id === colId; });
    if (!col) return;
    var grp = col.groups.find(function (g) { return g.id === groupId; });
    if (!grp) return;
    var affected = col.cards.filter(function (c) { return c.groupId === groupId; });
    if (affected.length > 0 && !confirm('グループ「' + grp.name + '」には ' + affected.length + ' 件のタスクがあります。削除すると未分類になります。よろしいですか？')) return;
    pushUndoSnapshot();
    col.cards.forEach(function (c) { if (c.groupId === groupId) c.groupId = null; });
    col.groups = col.groups.filter(function (g) { return g.id !== groupId; });
    save();
    render();
    showToast('グループ「' + grp.name + '」を削除しました');
  }

  function moveCard(cardId, targetColId) {
    var sourceCol = null, card = null;
    state.columns.forEach(function (c) {
      var idx = c.cards.findIndex(function (cd) { return cd.id === cardId; });
      if (idx !== -1) { sourceCol = c; card = c.cards[idx]; }
    });
    if (!card || !sourceCol || sourceCol.id === targetColId) return;
    pushUndoSnapshot();
    sourceCol.cards = sourceCol.cards.filter(function (c) { return c.id !== cardId; });
    card.groupId = null;
    var targetCol = state.columns.find(function (c) { return c.id === targetColId; });
    targetCol.cards.push(card);
    save();
    render();
  }

  function moveCardToGroup(cardId, targetColId, groupId) {
    var sourceCol = null, card = null;
    state.columns.forEach(function (c) {
      var idx = c.cards.findIndex(function (cd) { return cd.id === cardId; });
      if (idx !== -1) { sourceCol = c; card = c.cards[idx]; }
    });
    if (!card) return;
    pushUndoSnapshot();
    if (sourceCol.id === targetColId) {
      card.groupId = groupId;
    } else {
      sourceCol.cards = sourceCol.cards.filter(function (c) { return c.id !== cardId; });
      card.groupId = groupId;
      var targetCol = state.columns.find(function (c) { return c.id === targetColId; });
      targetCol.cards.push(card);
    }
    save();
    render();
  }

  function reorderCardManual(draggedId, targetColId, targetCardId, before) {
    var sourceCol = null, card = null;
    state.columns.forEach(function (c) {
      var idx = c.cards.findIndex(function (cd) { return cd.id === draggedId; });
      if (idx !== -1) { sourceCol = c; card = c.cards[idx]; }
    });
    if (!card) return;
    pushUndoSnapshot();
    sourceCol.cards = sourceCol.cards.filter(function (c) { return c.id !== draggedId; });
    var targetCol = state.columns.find(function (c) { return c.id === targetColId; });
    var targetIdx = targetCol.cards.findIndex(function (c) { return c.id === targetCardId; });
    var targetCard = targetCol.cards[targetIdx];
    card.groupId = targetCard ? targetCard.groupId : null;
    if (targetIdx === -1) targetCol.cards.push(card);
    else targetCol.cards.splice(before ? targetIdx : targetIdx + 1, 0, card);
    save();
    render();
  }

  function toggleCardSelection(id, el) {

  function updateBulkBar() {
    var bar = document.getElementById("bulk-bar");
    var count = selectedCardIds.size;
    bar.hidden = count === 0;
    if (count === 0) return;
    document.getElementById("bulk-count").textContent = count + "件選択中";
    var select = document.getElementById("bulk-move-select");
    var current = select.value;
    select.innerHTML = '<option value="">移動先を選択...</option>' + state.columns.slice().sort(function (a, b) { return a.order - b.order; }).map(function (c) {
      return '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>';
    }).join("");
    select.value = current;
  }
  function bulkMoveTo(targetColId) {
    pushUndoSnapshot();
    var moving = [];
    state.columns.forEach(function (c) {
      c.cards = c.cards.filter(function (cd) {
        if (selectedCardIds.has(cd.id)) { moving.push(cd); return false; }
        return true;
      });
    });
    moving.forEach(function (cd) { cd.groupId = null; });
    var target = state.columns.find(function (c) { return c.id === targetColId; });
    target.cards = target.cards.concat(moving);
    save();
  }

  document.getElementById("btn-save-card").addEventListener("click", function () {

    if (!title) { fTitle.focus(); return; }
    var targetCol = state.columns.find(function (c) { return c.id === statusSelect.value; });
    var targetGroupId = groupSelect.value || null;
    var links = currentLinks.filter(function (l) { return l.url.trim(); }).map(function (l) { return { id: l.id, label: l.label.trim(), url: l.url.trim() }; });
    var tags = currentTags.slice();
    pushUndoSnapshot();

    if (currentCardCtx.cardId) {
      var oldCol = state.columns.find(function (c) { return c.id === currentCardCtx.columnId; });
      var card = oldCol.cards.find(function (c) { return c.id === currentCardCtx.cardId; });
      card.title = title;
      card.assignee = fAssignee.value.trim();
      card.startDate = fStartDate;
      card.dueDate = fDueDate;
      card.links = links;
      card.memo = fMemo.value.trim();
      card.priority = selectedPriority;
      card.tags = tags;
      card.groupId = targetGroupId;
      if (oldCol.id !== targetCol.id) {
        oldCol.cards = oldCol.cards.filter(function (c) { return c.id !== card.id; });
        targetCol.cards.push(card);

  function doExport() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "task_tracker_export.json";
    a.click();
    URL.revokeObjectURL(url);
    showToast("JSONを書き出しました");
  }
  document.getElementById("file-import").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!data.columns) throw new Error("invalid");
        state = migrate(data);
        undoStack = [];
        redoStack = [];
        save();
        render();
        showToast("JSONを読み込みました");
      } catch (err) {
        alert("JSONの読み込みに失敗しました。形式を確認してください。");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });
  function doReset() {
    if (!confirm("サンプルデータに戻します。現在の内容は失われます。よろしいですか？")) return;
    state = sampleData();
    undoStack = [];
    redoStack = [];
    save();
    render();
    showToast("サンプルデータに戻しました");
  }

  modalScrim.addEventListener("click", function () { closeDrawer(); });

  /* ================= Setting: ユーザー名・複数ユーザー・保存先 ================= */
  var settingUsernameInput = document.getElementById("setting-username");
  var settingMultiUser = document.getElementById("setting-multiuser");
  var settingSavepathInput = document.getElementById("setting-savepath");

  function syncUserChip() {
    var name = state.settings.currentUser || "泉谷";
    document.getElementById("user-name").textContent = name;
    document.getElementById("user-avatar").textContent = initials(name);
  }

  settingUsernameInput.addEventListener("input", function (e) {
    state.settings.currentUser = e.target.value;
    syncUserChip();
    save();
  });
  settingMultiUser.addEventListener("change", function (e) {
    state.settings.multiUser = e.target.checked;
    save();
    render();
  });
  settingSavepathInput.addEventListener("input", function (e) {
    state.settings.savePath = e.target.value;
    save();
  });
  document.getElementById("setting-browse").addEventListener("click", function () {
    showToast("Electron版ではネイティブのフォルダ選択ダイアログを開きます");
  });

  render();
})();
</script>
